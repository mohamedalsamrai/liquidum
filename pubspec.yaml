name: liquidum
description: >-
  Apple's iOS 26 Liquid Glass for Flutter, measured against UIKit: glass,
  buttons, controls, tab and navigation bars, menus, sheets, alerts and
  popovers.
version: 0.2.2
repository: https://github.com/mohamedalsamrai/liquidum
issue_tracker: https://github.com/mohamedalsamrai/liquidum/issues
topics:
  - liquid-glass
  - tab-bar
  - cupertino
  - ios
  - glassmorphism
screenshots:
  - description: The showcase app, light and dark, over photos.
    path: doc/images/showcase/showcase.webp
  - description: A pull-down menu, a context menu and a button's menu.
    path: doc/images/showcase/menus.webp
  - description: A sheet, an alert, a popover and an action sheet.
    path: doc/images/showcase/presentations.webp
  - description: The glass tab bar over content, light, dark and styled.
    path: doc/images/hero.png

platforms:
  android:
  ios:

environment:
  sdk: ^3.12.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  shaders:
    - shaders/glass.frag
    - shaders/field.frag
    - shaders/backdrop.frag
    - shaders/vibrant.frag
    - shaders/lens.frag
    - shaders/scroll_edge.frag
    - shaders/popover_shadow.frag
