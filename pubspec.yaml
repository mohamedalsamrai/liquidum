name: liquidum
description: >-
  The iOS 26 Liquid Glass tab bar for Flutter, measured against UIKit: real
  refraction, a lifting lens, adaptive light and dark glass, and full styling.
version: 0.0.1
repository: https://github.com/mohamedalsamrai/liquidum
issue_tracker: https://github.com/mohamedalsamrai/liquidum/issues
topics:
  - liquid-glass
  - tab-bar
  - cupertino
  - ios
  - glassmorphism
screenshots:
  - description: The glass tab bar over content, light, dark and styled.
    path: doc/images/hero.png

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  shaders:
    - shaders/glass.frag
    - shaders/field.frag
    - shaders/backdrop.frag
