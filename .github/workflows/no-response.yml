name: No Response

# Works with the `waiting for response` label:
# - when the author of the issue or PR comments, the label comes off;
# - if 21 days pass without a reply from them, the issue or PR is closed.

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  no-response:
    name: No response
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'mohamedalsamrai/liquidum' &&
      (github.event_name != 'issue_comment' ||
       contains(github.event.issue.labels.*.name, 'waiting for response'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const noResponse = require('./.github/scripts/no-response.js');
            await noResponse({ github, context });
