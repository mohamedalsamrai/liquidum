name: Pull Request Labeler

# Adds area labels to pull requests from the paths they change, using the
# rules in .github/labeler.yml.
#
# pull_request_target runs with the base branch's code and a token that can
# label PRs from forks. That is safe here because nothing from the pull request
# is checked out or run: the labeler only reads the list of changed files.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'mohamedalsamrai/liquidum' }}
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
